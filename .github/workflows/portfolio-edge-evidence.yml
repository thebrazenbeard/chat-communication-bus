name: public-portfolio-edge-evidence

on:
  pull_request:
    paths:
      - "portfolio/**"
      - "tests/governance/test_public_ecosystem_edge_evidence.py"
      - ".github/workflows/portfolio-edge-evidence.yml"
  push:
    branches: ["main"]
    paths:
      - "portfolio/**"
      - "tests/governance/test_public_ecosystem_edge_evidence.py"
      - ".github/workflows/portfolio-edge-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned test dependency
        run: python -m pip install 'pytest==9.1.1'

      - name: Validate public inventory and evidence axes
        run: python -m pytest -q tests/governance/test_public_only_owner_inventory.py tests/governance/test_public_ecosystem_edge_evidence.py
