name: Self Image V3R2 Clean Visual Evidence

on:
  push:
    branches:
      - feature/selfimage-blender-relay-v1
    paths:
      - .github/workflows/selfimage-thorax-v3r2-clean-evidence.yml
      - projects/selfimage/blender-relay/approved-scripts/selfimage_thorax_v3r2_clean_evidence.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.actor == 'thebrazenbeard'
    runs-on: [self-hosted, windows, x64, vera-blender]
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering clean-evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Render uncontaminated V2 and V3R2 views
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $outDir=Join-Path '${{ runner.temp }}' 'vera-v3r2-clean-evidence'
          New-Item -ItemType Directory -Force -Path $outDir|Out-Null
          function Send-BlenderCommand {
            param([Parameter(Mandatory=$true)][string]$Type,[hashtable]$Params=@{},[int]$TimeoutMs=300000)
            $client=[Net.Sockets.TcpClient]::new();$client.ReceiveTimeout=$TimeoutMs;$client.SendTimeout=$TimeoutMs
            try {
              $async=$client.BeginConnect('127.0.0.1',9876,$null,$null);if(-not $async.AsyncWaitHandle.WaitOne(5000)){throw 'Blender MCP connect timeout'};$client.EndConnect($async);$stream=$client.GetStream()
              $payload=@{type=$Type;params=$Params}|ConvertTo-Json -Compress -Depth 50;$bytes=[Text.Encoding]::UTF8.GetBytes($payload);$stream.Write($bytes,0,$bytes.Length);$stream.Flush();$mem=[IO.MemoryStream]::new();$buf=New-Object byte[] 8192
              while($true){try{$count=$stream.Read($buf,0,$buf.Length)}catch [System.IO.IOException]{break};if($count -le 0){break};$mem.Write($buf,0,$count);$text=[Text.Encoding]::UTF8.GetString($mem.ToArray());try{return($text|ConvertFrom-Json)}catch{}}
              throw "Incomplete Blender JSON for $Type"
            } finally {$client.Dispose()}
          }
          $addon=Send-BlenderCommand -Type 'get_addon_info' -TimeoutMs 15000;if($addon.status -ne 'success'){throw 'Blender addon preflight failed'}
          $script=Join-Path '${{ github.workspace }}' 'projects\selfimage\blender-relay\approved-scripts\selfimage_thorax_v3r2_clean_evidence.py';if(-not(Test-Path -LiteralPath $script)){throw 'Clean evidence script missing'}
          $outJson=($outDir|ConvertTo-Json -Compress);$code="OUTPUT_DIR = $outJson`n"+(Get-Content -LiteralPath $script -Raw);$response=Send-BlenderCommand -Type 'execute_code' -Params @{code=$code} -TimeoutMs 300000;if($response.status -ne 'success'){throw($response|ConvertTo-Json -Depth 20 -Compress)}
          $required=@('CLEAN_RENDER_RECEIPT.json');foreach($prefix in @('V2','V3R2')){foreach($view in @('FRONT','FRONT_3Q','SIDE','REAR_3Q','REAR')){$required+="${prefix}_${view}_CLEAN.png"}}
          $files=@();foreach($name in $required){$p=Join-Path $outDir $name;if(-not(Test-Path -LiteralPath $p)){throw "Missing clean evidence artifact: $name"};$item=Get-Item $p;$files+=[ordered]@{name=$name;bytes=$item.Length;sha256=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}}
          [ordered]@{schema='SELFIMAGE_V3R2_CLEAN_EVIDENCE_RELAY_RECEIPT';status='ARTIFACTS_VERIFIED / HOSTILE_VISUAL_REVIEW_REQUIRED';runner=$env:COMPUTERNAME;files=$files}|ConvertTo-Json -Depth 30|Set-Content -LiteralPath (Join-Path $outDir 'RELAY_RECEIPT.json') -Encoding UTF8

      - name: Upload clean V3R2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vera-v3r2-clean-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}\vera-v3r2-clean-evidence
          if-no-files-found: error
          retention-days: 30
