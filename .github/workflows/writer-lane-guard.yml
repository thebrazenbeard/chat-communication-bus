name: Writer Lane Guard

# Ordinary writer-lane pushes are validated inside the trusted projection path
# before transport. Keep this standalone guard as an explicit forensic/manual
# verifier without spending a second hosted job on every Bus mutation.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact ancestor SHA immediately before the transition/range to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-current-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact writer lane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: lane
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current Radar control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install current Radar control package
        run: python -m pip install -e control

      - name: Validate requested mailbox transition range
        env:
          RADAR_REF: ${{ github.ref }}
          RADAR_HEAD: ${{ github.sha }}
          RADAR_BASE: ${{ inputs.base_sha }}
        run: |
          RADAR_BOOTSTRAP_MAIN="$(git -C control rev-parse HEAD)"
          python control/scripts/radar_validate_writer_lane.py \
            --repo-dir lane \
            --ref "$RADAR_REF" \
            --head "$RADAR_HEAD" \
            --base "$RADAR_BASE" \
            --topology control/architecture/contracts/RADAR_TOPOLOGY_V1.json \
            --cutover control/architecture/contracts/RADAR_WRITER_LANE_V2_CUTOVER.json \
            --bootstrap-main "$RADAR_BOOTSTRAP_MAIN"
