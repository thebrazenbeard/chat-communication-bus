name: source-and-public-transition-integrity

on:
  push:
    branches:
      - "main"
      - "bus/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install bounded test dependency
        run: python -m pip install 'pytest==9.1.1'

      - name: Validate CCB Base pin and public-transition boundary
        run: python -m pytest -q tests/radar/test_ccb_base_pin_contract.py tests/radar/test_public_visibility_contract.py

      - name: Parse private topology contracts
        run: |
          python -m json.tool architecture/contracts/CCB_BASE_CONTROL_PIN_V1.json >/dev/null
          python -m json.tool architecture/contracts/RADAR_TOPOLOGY_V1.json >/dev/null
          python -m json.tool architecture/contracts/RADAR_WRITER_LANE_V2_CUTOVER.json >/dev/null

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
