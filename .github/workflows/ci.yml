name: ci

on:
  push:
    branches:
      - "main"
      - "radar/**"
      - "feature/chat-bus-vertical-slice-v1"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pip==26.2.1'
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - run: python scripts/radar_source_hashes.py

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.6
      - name: Install Edge dependencies from frozen lock
        working-directory: supabase/functions/github-bus-ingest
        run: deno ci
      - name: Type-check Edge function from frozen dependency graph
        working-directory: supabase/functions/github-bus-ingest
        run: deno check index.ts

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from migration chain
        run: supabase db reset
      - name: Run every Radar SQL assertion
        env:
          PGURI: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for test_file in supabase/tests/radar_*.sql; do
            echo "==> ${test_file}"
            psql "${PGURI}" -v ON_ERROR_STOP=1 -f "${test_file}"
          done
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
