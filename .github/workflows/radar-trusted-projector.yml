name: Radar Trusted Projector

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  project-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve immutable called workflow source
        id: self_pin
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repository = "thebrazenbeard/chat-communication-bus"
          workflow_path = ".github/workflows/radar-trusted-projector.yml"
          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          output_path = os.environ.get("GITHUB_OUTPUT")
          if not request_url or not request_token or not output_path:
              raise SystemExit("RADAR_SELF_PIN_OIDC_CONTEXT_MISSING")

          separator = "&" if "?" in request_url else "?"
          url = request_url + separator + urllib.parse.urlencode(
              {"audience": "radar-trusted-projector-self-pin-v1"}
          )
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"bearer {request_token}"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              body = json.load(response)

          token = body.get("value")
          if not isinstance(token, str):
              raise SystemExit("RADAR_SELF_PIN_TOKEN_MISSING")
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit("RADAR_SELF_PIN_TOKEN_INVALID")
          payload_segment = parts[1] + "=" * (-len(parts[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload_segment).decode("utf-8"))

          job_workflow_ref = claims.get("job_workflow_ref")
          job_workflow_sha = claims.get("job_workflow_sha")
          if claims.get("repository") != repository:
              raise SystemExit("RADAR_SELF_PIN_REPOSITORY_INVALID")
          if not isinstance(job_workflow_sha, str) or re.fullmatch(r"[0-9a-f]{40}", job_workflow_sha) is None:
              raise SystemExit("RADAR_SELF_PIN_SHA_INVALID")
          expected_ref = f"{repository}/{workflow_path}@{job_workflow_sha}"
          if job_workflow_ref != expected_ref:
              raise SystemExit("RADAR_SELF_PIN_WORKFLOW_REF_INVALID")

          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"sha={job_workflow_sha}\n")
          PY

      - name: Check out pinned CCB Base control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thebrazenbeard/ccb-core
          ref: 42e4409dff3baee4acb63b48c9f64c7367a4fd22
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out current canonical main as inert Git data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thebrazenbeard/chat-communication-bus
          ref: main
          path: canonical
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Verify canonical control snapshot without executing mutable source
        env:
          PYTHONPATH: control/src
        run: |
          git -C canonical update-ref refs/remotes/origin/main "$(git -C canonical rev-parse HEAD)"
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from radar.trusted_control_snapshot import materialize_current_control_snapshot

          repo = Path("canonical")
          out = Path(os.environ["RUNNER_TEMP"]) / "radar-current-control"
          snapshot = materialize_current_control_snapshot(repo, out)
          head = subprocess.check_output(
              ["git", "-C", str(repo), "rev-parse", "HEAD"], text=True
          ).strip()
          if snapshot.main_head_sha != head:
              raise SystemExit("RADAR_CANONICAL_MAIN_SNAPSHOT_MISMATCH")
          print(f"canonical_main_sha={snapshot.main_head_sha}")
          print(f"topology_blob_sha={snapshot.topology_blob_sha}")
          print(f"cutover_blob_sha={snapshot.cutover_blob_sha}")
          PY

      - name: Project canonical reconciliation targets
        env:
          PYTHONPATH: control/src
          RADAR_RECONCILE_MODE: project
          RADAR_PROJECTION_ENDPOINT: "https://klmbpaigzeguvnpccqzz.supabase.co/functions/v1/github-bus-ingest"
        run: |
          python control/scripts/radar_trusted_project.py \
            --repo-dir canonical \
            --topology canonical/architecture/contracts/RADAR_TOPOLOGY_V1.json \
            --cutover canonical/architecture/contracts/RADAR_WRITER_LANE_V2_CUTOVER.json
