name: Radar Trusted Projector

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  project-mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact writer lane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: lane
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted Radar control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: thebrazenbeard/chat-communication-bus
          ref: 3a2bb6b857784c990e8625ea7731954754a513b5
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install trusted Radar control package
        run: python -m pip install -e control

      - name: Project exact Bus delta
        env:
          RADAR_REPOSITORY: ${{ github.repository }}
          RADAR_REF: ${{ github.ref }}
          RADAR_HEAD: ${{ github.sha }}
          RADAR_BASE: ${{ github.event.before }}
        run: |
          RADAR_BOOTSTRAP_MAIN="$(git -C control rev-parse HEAD)"
          python control/scripts/radar_emit_bus_projection.py \
            --repo-dir lane \
            --repository "$RADAR_REPOSITORY" \
            --ref "$RADAR_REF" \
            --head "$RADAR_HEAD" \
            --base "$RADAR_BASE" \
            --topology control/architecture/contracts/RADAR_TOPOLOGY_V1.json \
            --cutover control/architecture/contracts/RADAR_WRITER_LANE_V2_CUTOVER.json \
            --bootstrap-main "$RADAR_BOOTSTRAP_MAIN"
