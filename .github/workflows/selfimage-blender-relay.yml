name: Self Image Blender Relay

on:
  push:
    branches:
      - feature/selfimage-blender-relay-v1
    paths:
      - projects/selfimage/blender-relay/requests/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selfimage-blender-relay-v1
  cancel-in-progress: false

jobs:
  relay:
    if: github.actor == 'thebrazenbeard'
    runs-on: [self-hosted, windows, x64, vera-blender]
    timeout-minutes: 20

    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Process pending Blender requests
        id: process
        continue-on-error: true
        shell: powershell
        run: |
          $artifactRoot = Join-Path '${{ runner.temp }}' 'vera-blender-relay-artifacts'
          & '${{ github.workspace }}\projects\selfimage\blender-relay\relay\Process-PendingRequests.ps1' `
            -Workspace '${{ github.workspace }}' `
            -ArtifactRoot $artifactRoot

      - name: Upload Blender relay artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vera-blender-relay-${{ github.run_id }}
          path: ${{ runner.temp }}\vera-blender-relay-artifacts
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit durable result receipts with narrow write authority
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'vera-blender-relay'
          git config user.email 'vera-blender-relay@users.noreply.github.com'
          git add -- 'projects/selfimage/blender-relay/results/*.json'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Self Image Blender relay: record result receipts'
            $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
            $authHeader = "AUTHORIZATION: basic $basic"
            git -c "http.https://github.com/.extraheader=$authHeader" fetch origin '${{ github.ref_name }}'
            git rebase "origin/${{ github.ref_name }}"
            git -c "http.https://github.com/.extraheader=$authHeader" push origin "HEAD:${{ github.ref_name }}"
          } else {
            Write-Host 'No new durable result receipts to commit.'
          }

      - name: Preserve failure status
        if: steps.process.outcome == 'failure'
        shell: powershell
        run: |
          throw 'One or more Blender relay requests failed. Inspect the committed result receipt(s) and workflow artifact.'
