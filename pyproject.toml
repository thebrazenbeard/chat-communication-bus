[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-communication-bus"
version = "0.1.0"
description = "Radar V1 control-plane and durable Chat Bus coordination primitives."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "colorama==0.4.6; sys_platform == \"win32\"",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "Pygments==2.21.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
